resources:
  jobs:
    boc_ingestion:
      name: "[BOC] Data Ingestion"
      tags:
        project: boc-agent
      schedule:
        # Daily at 06:00 America/Toronto
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED
      tasks:
        - task_key: grants
          notebook_task:
            notebook_path: ../ingestion/00_grants.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_sp: ${var.app_sp}
              warehouse_id: ${var.warehouse_id}
              vs_endpoint: ${var.vs_endpoint}
              genie_space_id: ${var.genie_space_id}

        - task_key: boc_valet
          notebook_task:
            notebook_path: ../ingestion/01_boc_valet.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: market_data
          notebook_task:
            notebook_path: ../ingestion/02_market_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: policy_docs
          notebook_task:
            notebook_path: ../ingestion/03_policy_docs.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_vs_index
          depends_on:
            - task_key: policy_docs
          notebook_task:
            notebook_path: ../ingestion/04_build_vs_index.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              vs_endpoint: ${var.vs_endpoint}
              embedding_endpoint: ${var.embedding_endpoint}

        - task_key: create_uc_functions
          depends_on:
            - task_key: market_data
          notebook_task:
            notebook_path: ../ingestion/05_create_uc_functions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
