<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank of Canada — Data Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontFamily: { sans: ["Arial", "Helvetica", "sans-serif"] },
          extend: {
            colors: {
              boc: {
                red: "#df0000",
                darkred: "#b00000",
                ink: "#23242c",
                gray: "#5b5f66",
                line: "#e3e3e6",
                mist: "#f4f4f4",
                tint: "#fdecec",
              },
            },
          },
        },
      };
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #23242c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useEffect, useRef, useCallback } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
      import htm from "https://esm.sh/htm@3.1.1";
      const html = htm.bind(React.createElement);

6 49.89 15.61 49.89 20.96 49.06 20.96 49.06 14.08 49.89 14.08 53.52 19.24 53.52 14.08 54.35 14.08 54.35 20.96 53.65 20.96"/><polyline points="60.46 21.02 57.21 17.46 57.21 20.96 56.26 20.96 56.26 14.08 57.21 14.08 57.21 17.14 60.14 14.08 61.23 14.08 58.23 17.27 61.42 20.77 60.46 21.02"/><path d="M67.47,21.09c-1.91,0-3.12-1.4-3.12-3.57S65.56,14,67.53,14s3.12,1.4,3.12,3.57-1.21,3.57-3.18,3.57m0-6.3c-1.34,0-2.17,1.08-2.17,2.67s.83,2.67,2.17,2.67,2.17-1.08,2.17-2.67S68.87,14.78,67.47,14.78Z" transform="translate(0)"/><polyline points="73.2 14.91 73.2 17.01 75.24 17.01 75.43 17.9 73.2 17.9 73.2 20.96 72.24 20.96 72.24 14.08 75.81 14.08 75.81 14.91 73.2 14.91"/><path d="M82.3,21.09c-1.91,0-3.18-1.4-3.18-3.57S80.39,14,82.3,14a3.29,3.29,0,0,1,2,.57l-.13,1a2.94,2.94,0,0,0-1.85-.64c-1.4,0-2.23,1.08-2.23,2.67s.83,2.67,2.23,2.67a3.17,3.17,0,0,0,1.91-.7l.13.89a3.56,3.56,0,0,1-2,.7" transform="translate(0)"/><path d="M90.46,21l-.83-2.1h-2.8L86,21H85l2.67-6.88h1l2.61,6.75-.83.19m-2.23-5.86L87.14,18h2.17Z" transform="translate(0)"/><polyline points="97.27 20.96 93.51 15.61 93.51 20.96 92.62 20.96 92.62 14.08 93.45 14.08 97.14 19.24 97.14 14.08 97.97 14.08 97.97 20.96 97.27 20.96"/><path d="M104.66,21l-.83-2.1H101l-.76,2h-1L102,14.08h1l2.61,6.75-.89.19m-2.23-5.86L101.35,18h2.17Z" transform="translate(0)"/><path d="M108.8,21h-2V14.08h2c2.36,0,3.63,1.4,3.63,3.44S111.15,21,108.8,21m.06-6.05h-1.08v5.16h1.08a2.32,2.32,0,0,0,2.61-2.61A2.36,2.36,0,0,0,108.86,14.91Z" transform="translate(0)"/><path d="M118.16,21l-.83-2.17h-2.8l-.76,2h-1L115.48,14h1l2.67,6.75-1,.25m-2.23-5.86L114.85,18h2.23Z" transform="translate(0)"/></g></svg>`;

      const api = {
        async getUser() { const r = await fetch("/api/user"); return r.json(); },
        async getResources() { const r = await fetch("/api/resources"); return r.json(); },
        async listSessions() { const r = await fetch("/api/sessions"); return (await r.json()).sessions ?? []; },
        async loadSession(id) { const r = await fetch(`/api/sessions/${id}`); return (await r.json()).turns ?? []; },
        async feedback(traceId, value) {
          await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ trace_id: traceId, value }) });
        },
        async streamChat(payload, onEvent) {
          const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          const reader = r.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const frames = buf.split("\n\n");
            buf = frames.pop() ?? "";
            for (const f of frames) {
              const line = f.trim();
              if (!line.startsWith("data:")) continue;
              try { onEvent(JSON.parse(line.slice(5).trim())); } catch {}
            }
          }
        },
      };

      function Reference({ r }) {
        if (r.type === "document")
          return html`<div class="rounded border border-boc-line bg-boc-mist px-3 py-2 text-xs">
            📄 <a href=${r.url} target="_blank" rel="noreferrer" class="font-bold text-boc-red hover:underline">${r.label}</a>
            ${r.snippet && html`<p class="mt-1 text-boc-gray">${r.snippet}…</p>`}
          </div>`;
        if (r.type === "sql")
          return html`<div class="rounded border border-boc-line bg-boc-mist px-3 py-2 text-xs">
            🗄️ <span class="font-bold">Genie SQL</span>
            <pre class="mt-1 overflow-x-auto whitespace-pre-wrap text-[11px] text-boc-gray">${r.sql}</pre>
          </div>`;
        if (r.type === "anomaly")
          return html`<div class="rounded border border-boc-line bg-boc-mist px-3 py-2 text-xs text-boc-ink">
            ⚠️ <span class="font-bold">${r.label}</span>: close ${r.close}, forecast ${r.forecast}
            (${((Number(r.pct_deviation) || 0) * 100).toFixed(1)}% deviation)
          </div>`;
        return null;
      }

      function References({ refs }) {
        if (!refs || refs.length === 0) return null;
        return html`<div class="mt-3 space-y-2 border-t border-boc-line pt-2">
          <div class="text-xs font-bold uppercase tracking-wide text-boc-gray">References</div>
          ${refs.map((r, i) => html`<${Reference} key=${i} r=${r} />`)}
        </div>`;
      }

      function Feedback({ traceId, traceBase }) {
        const [picked, setPicked] = useState(null);
        if (!traceId) return null;
        const choose = (v) => { setPicked(v); api.feedback(traceId, v); };
        const traceUrl = traceBase ? `${traceBase}/traces?selectedTraceId=${traceId}` : null;
        return html`<div class="mt-2 flex items-center gap-3 text-sm">
          <button onClick=${() => choose(true)} class=${`hover:opacity-70 ${picked === true ? "opacity-100" : "opacity-40"}`} title="Helpful">👍</button>
          <button onClick=${() => choose(false)} class=${`hover:opacity-70 ${picked === false ? "opacity-100" : "opacity-40"}`} title="Not helpful">👎</button>
          ${traceUrl && html`<a href=${traceUrl} target="_blank" rel="noreferrer" class="text-xs text-boc-gray hover:text-boc-red hover:underline">View trace ↗</a>`}
        </div>`;
      }

      function Bubble({ m, traceBase }) {
        const isUser = m.role === "user";
        return html`<div class=${`flex ${isUser ? "justify-end" : "justify-start"}`}>
          <div class=${`max-w-2xl rounded-lg px-4 py-3 text-sm leading-relaxed ${isUser ? "bg-boc-tint text-boc-ink border border-boc-line" : "bg-white text-boc-ink border border-boc-line shadow-sm"}`}>
            <div class="whitespace-pre-wrap">${m.content || "…"}</div>
            ${!isUser && html`<${References} refs=${m.references} />`}
            ${!isUser && html`<${Feedback} traceId=${m.trace_id} traceBase=${traceBase} />`}
          </div>
        </div>`;
      }

      const SUGGESTIONS = [
        "What is the current overnight target rate?",
        "Are there any anomalies in GOLD over the last 60 days?",
        "What is the Bank of Canada's inflation-control target?",
      ];

      function App() {
        const [user, setUser] = useState(null);
        const [resources, setResources] = useState({});
        const [sessions, setSessions] = useState([]);
        const [messages, setMessages] = useState([]);
        const [sessionId, setSessionId] = useState(null);
        const [genieConv, setGenieConv] = useState(null);
        const [streaming, setStreaming] = useState(false);
        const [toolStatus, setToolStatus] = useState(null);
        const [text, setText] = useState("");
        const endRef = useRef(null);

        const refreshSessions = useCallback(async () => setSessions(await api.listSessions()), []);
        useEffect(() => { api.getUser().then(setUser); api.getResources().then(setResources); refreshSessions(); }, []);
        useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, toolStatus]);

        const openSession = async (id) => { setMessages(await api.loadSession(id)); setSessionId(id); setGenieConv(null); };
        const newConversation = () => { setMessages([]); setSessionId(null); setGenieConv(null); };

        const send = async (q) => {
          const text = (q ?? "").trim();
          if (!text || streaming) return;
          const history = messages.map((m) => ({ role: m.role, content: m.content }));
          let local = [...messages, { role: "user", content: text }, { role: "assistant", content: "", references: [] }];
          setMessages(local);
          setStreaming(true); setToolStatus(null);
          const patch = (fn) => { local = local.map((m, i) => (i === local.length - 1 ? { ...m } : m)); fn(local[local.length - 1]); setMessages([...local]); };
          try {
            await api.streamChat({ message: text, session_id: sessionId, history, genie_conversation_id: genieConv }, (e) => {
              if (e.type === "delta") patch((a) => (a.content += e.text));
              else if (e.type === "mode" && e.mode === "deep") setToolStatus("🔬 Deep investigation (reasoning model)…");
              else if (e.type === "tool") setToolStatus(e.status === "running" ? `Using ${(e.names ?? []).join(", ")}…` : null);
              else if (e.type === "references") patch((a) => (a.references = e.references));
              else if (e.type === "meta" || e.type === "final") {
                if (e.session_id) setSessionId(e.session_id);
                if (e.genie_conversation_id) setGenieConv(e.genie_conversation_id);
                if (e.trace_id) patch((a) => (a.trace_id = e.trace_id));
                // The final event carries the authoritative full answer; reconcile
                // so the displayed message is never a partial/truncated stream.
                if (e.type === "final") patch((a) => {
                  if (typeof e.text === "string" && e.text) a.content = e.text;
                  if (Array.isArray(e.references)) a.references = e.references;
                });
              } else if (e.type === "error") patch((a) => (a.content += `\n\n_Error: ${e.message}_`));
            });
          } finally { setStreaming(false); setToolStatus(null); refreshSessions(); }
        };

        return html`<div class="flex h-full flex-col">
          <div class="h-1 bg-boc-red"></div>
          <header class="flex items-center gap-4 border-b border-boc-line bg-white px-6 py-3">
            <span class="text-boc-ink" dangerouslySetInnerHTML=${{ __html: LOGO_SVG }}></span>
            <span class="h-7 w-px bg-boc-line"></span>
            <div class="text-sm font-bold tracking-tight text-boc-ink">Data Assistant</div>
            <div class="ml-auto text-right text-sm">
              <div class="font-bold text-boc-ink">${user?.name ?? "…"}</div>
              <div class="text-xs text-boc-gray">${user?.email ?? ""}</div>
            </div>
          </header>
          <div class="flex min-h-0 flex-1">
            <aside class="flex w-72 flex-col border-r border-boc-line bg-white">
              <button onClick=${newConversation} class="m-3 rounded bg-boc-red px-3 py-2 text-sm font-bold text-white hover:bg-boc-darkred">+ New conversation</button>
              <div class="px-3 pb-2 text-xs font-bold uppercase tracking-wide text-boc-gray">Your conversations</div>
              <ul class="flex-1 overflow-y-auto px-2">
                ${sessions.length === 0 && html`<li class="px-2 py-2 text-sm text-boc-gray">No conversations yet.</li>`}
                ${sessions.map((s) => html`<li key=${s.session_id} onClick=${() => openSession(s.session_id)} title=${s.title}
                  class=${`cursor-pointer truncate rounded px-2 py-2 text-sm hover:bg-boc-mist ${s.session_id === sessionId ? "bg-boc-mist font-bold" : ""}`}>${s.title}</li>`)}
              </ul>
              <div class="border-t border-boc-line p-3 text-xs">
                <div class="mb-1 font-bold uppercase tracking-wide text-boc-gray">Resources</div>
                <div class="flex flex-col gap-1">
                  ${resources.experiment_traces && html`<a href=${resources.experiment_traces} target="_blank" rel="noreferrer" class="text-boc-red hover:underline">📊 MLflow traces</a>`}
                  ${resources.genie_space && html`<a href=${resources.genie_space} target="_blank" rel="noreferrer" class="text-boc-red hover:underline">💬 Genie space</a>`}
                  ${resources.vector_index && html`<a href=${resources.vector_index} target="_blank" rel="noreferrer" class="text-boc-red hover:underline">🔎 Vector Search index</a>`}
                  ${resources.anomaly_function && html`<a href=${resources.anomaly_function} target="_blank" rel="noreferrer" class="text-boc-red hover:underline">⚠️ Anomaly function</a>`}
                </div>
              </div>
            </aside>
            <main class="flex min-h-0 flex-1 flex-col bg-boc-mist">
              <div class="flex-1 space-y-4 overflow-y-auto p-6">
                ${messages.length === 0 && html`<div class="mx-auto max-w-xl pt-10 text-center text-boc-gray">
                  <p class="mb-4">Ask about Bank of Canada rates, market anomalies, or policy documents.</p>
                  <div class="space-y-2">${SUGGESTIONS.map((s) => html`<button key=${s} onClick=${() => send(s)} class="block w-full rounded border border-boc-line bg-white px-4 py-2 text-left text-sm text-boc-ink hover:border-boc-red">${s}</button>`)}</div>
                </div>`}
                ${messages.map((m, i) => html`<${Bubble} key=${i} m=${m} traceBase=${resources.experiment_base} />`)}
                ${toolStatus && html`<div class="text-center text-xs italic text-boc-gray">${toolStatus}</div>`}
                <div ref=${endRef}></div>
              </div>
              <div class="border-t border-boc-line bg-white p-4">
                <div class="flex gap-2">
                  <input value=${text} onInput=${(e) => setText(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && (send(text), setText(""))}
                    disabled=${streaming} placeholder="Ask a question…"
                    class="flex-1 rounded border border-boc-line px-4 py-3 text-sm focus:border-boc-red focus:outline-none disabled:bg-boc-mist" />
                  <button onClick=${() => { send(text); setText(""); }} disabled=${streaming || !text.trim()}
                    class="rounded bg-boc-red px-5 py-3 text-sm font-bold text-white hover:bg-boc-darkred disabled:opacity-50">Send</button>
                </div>
              </div>
            </main>
          </div>
        </div>`;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
