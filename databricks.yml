bundle:
  name: boc-fis-returns

variables:
  catalog:
    description: Unity Catalog catalog for all assets
    default: shm_catalog
  views_schema:
    description: Schema holding the regulatory-return fact tables (one per return)
    default: views_db
  metadata_schema:
    description: Schema holding the decoder, concepts, and validation rules
    default: metadata_db
  data_mode:
    description: "'synthetic' (generate demo filings) or 'existing' (point at the customer's real views_db/metadata_db)"
    default: synthetic
  vs_endpoint:
    description: Vector Search endpoint name
    default: boc-vs-endpoint
  embedding_endpoint:
    description: Embedding serving endpoint (1024-dim on skunkworks)
    default: databricks-gte-large-en
  warehouse_id:
    description: SQL warehouse id
    default: 505ec857e6b4ea23
  genie_space_id:
    description: Genie space id (set after create_genie_space.py)
    default: "01f18bd8451e1de79e8efee4c4593eae"
  mlflow_experiment_id:
    description: MLflow experiment id (from provision.py)
    default: "652880451028517"
  app_sp:
    description: boc-agent app service principal (application/client id)
    default: "ae3b7bd2-06f3-4a31-aec1-8247e0f7aa90"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-shm-skunkworks.cloud.databricks.com

include:
  - resources/*.yml
