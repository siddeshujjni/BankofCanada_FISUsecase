bundle:
  name: boc-agent

variables:
  catalog:
    description: Unity Catalog catalog for all assets
    default: shm_catalog
  schema:
    description: Unity Catalog schema for all assets
    default: boc_demo
  vs_endpoint:
    description: Vector Search endpoint name
    default: boc-vs-endpoint
  embedding_endpoint:
    description: Foundry embedding serving endpoint
    default: foundry-embedding
  warehouse_id:
    description: SQL warehouse id
    default: d94339f8fe9c593a
  genie_space_id:
    description: Genie space id
    default: 01f166aad95716d1995c011a0473f1d7
  app_sp:
    description: boc-agent app service principal (application/client id)
    default: f9284cb5-df03-4b35-8d72-0e01f45fe00e

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-qr9if1.cloud.databricks.com

include:
  - resources/*.yml
